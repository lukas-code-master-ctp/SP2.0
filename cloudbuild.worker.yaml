# Construye la imagen del motor: gcloud builds submit --config cloudbuild.worker.yaml --substitutions=_IMAGE=<imagen>
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.worker", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
# Con una cuenta de servicio propia, Cloud Build exige elegir dónde van los registros.
options:
  logging: CLOUD_LOGGING_ONLY
